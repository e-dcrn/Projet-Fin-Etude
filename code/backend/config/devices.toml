# ---------------------------------------------------------------------------
# Correspondance « type d'équipement » → environnement d'exécution.
#
# Ce fichier est strictement côté serveur : l'interface ne voit que des
# équipements réseau (PC, serveur, routeur, sonde IDS) et n'a jamais
# connaissance des images utilisées.
#
# Les switches n'apparaissent pas ici : chacun devient un réseau (bridge).
#
# Contraintes sur les images :
#   - toutes : un shell `sh` et la commande `ip` (iproute2 ou busybox) ;
#   - server : `python3`, utilisé pour simuler les services ouverts.
#
# `packages` : paquets Alpine (apk) ajoutés à l'image. Le moteur construit
# une fois pour toutes une image dérivée (mise en cache) ; busybox fournit
# déjà ping, traceroute, wget, nc… mais pas curl.
# ---------------------------------------------------------------------------

[lab]
# Préfixe des ressources créées (noms et labels). Tout ce qui porte ce
# préfixe est supprimé au redéploiement ou à l'arrêt du réseau.
prefix = "idslab"
# Image utilitaire éphémère, utilisée pour placer un segment surveillé en
# mode « hub » (recopie de tout le trafic vers la sonde IDS).
helper_image = "alpine:3.20"

[capture]
# Outil de capture du trafic d'un lien (vue « Wireshark » de l'interface) :
# un conteneur éphémère qui partage la pile réseau de l'équipement observé
# et y lance tcpdump. Rien n'est installé dans l'équipement lui-même.
image = "alpine:3.20"
packages = ["tcpdump"]

[traffic]
# Boîte à outils de génération de trafic : un conteneur éphémère qui partage la
# pile réseau d'un équipement (son IP, ses interfaces) pour, en son nom, soit
# jouer un agent de trafic « bénin » (navigation, consultations : voir
# traffic_agent.py), soit lancer un scénario d'audit (reconnaissance nmap).
# Comme la capture, rien n'est installé dans l'équipement lui-même.
# nmap : reconnaissance ; hydra : force brute (classe « Patator » des jeux CIC-IDS).
# Clients du trafic bénin : curl (web), openssh-client + sshpass (sessions SSH, SFTP),
# mariadb-client (MySQL) ; FTP, SMTP, DNS et Telnet passent par la bibliothèque Python.
image = "python:3.12-alpine"
packages = ["nmap", "nmap-scripts", "curl", "hydra", "openssh-client", "sshpass", "mariadb-client"]

[defaults]
# Processus qui maintient l'équipement allumé.
command = ["sleep", "infinity"]
# NET_ADMIN : configurer routes et interfaces ; NET_RAW : ping, capture.
cap_add = ["NET_ADMIN", "NET_RAW"]

[devices.pc]
image = "alpine:3.20"
# Clients disponibles dans le terminal (en plus de ceux de busybox : ping, nc, wget,
# nslookup…), pour tester chaque service d'un serveur (voir docs/SERVICES.md) :
# curl (HTTP, HTTPS, FTP, SMTP), openssh-client (ssh, scp, sftp), busybox-extras
# (telnet, ftpget, ftpput), mariadb-client (MySQL), bind-tools (dig).
# nmap et hydra : pour rejouer une attaque à la main depuis le terminal. Les attaques
# automatiques (scénarios, datasets) passent toujours par la boîte à outils [traffic].
packages = ["curl", "openssh-client", "busybox-extras", "mariadb-client", "bind-tools",
            "nmap", "nmap-scripts", "hydra"]

[devices.server]
# La commande est remplacée par le gestionnaire de services (voir service_listener.py).
# Chaque service ouvert est un vrai service : openssh (SSH), vsftpd (FTP),
# busybox-extras (telnetd), opensmtpd (SMTP), dnsmasq (DNS), mariadb (MySQL),
# openssl (certificat du site HTTPS) ; HTTP/HTTPS : serveur web Python.
# shadow : chpasswd/useradd pour le compte de démonstration.
image = "python:3.12-alpine"
packages = ["curl", "openssh", "vsftpd", "shadow", "busybox-extras", "opensmtpd", "dnsmasq",
            "mariadb", "mariadb-client", "openssl"]

[devices.router]
image = "alpine:3.20"

[devices.ids]
# Image provisoire : à remplacer par l'image de la sonde ML.
image = "alpine:3.20"
